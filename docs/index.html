<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Builder — Free Spreadsheet Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #1B2A4A;
    --gold: #D4AF37;
    --gold-dim: #B8962E;
    --bg: #0F1923;
    --surface: #162231;
    --surface-2: #1D2D40;
    --border: #2A3E56;
    --text: #E8ECF1;
    --text-dim: #8A9BB5;
    --white: #FFFFFF;
    --red: #E74C4C;
    --green: #4CAF50;
    --blue: #4A90D9;
    --radius: 8px;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  .header {
    background: var(--navy);
    border-bottom: 3px solid var(--gold);
    padding: 28px 24px 24px;
    text-align: center;
  }
  .header h1 { font-size: 28px; font-weight: 700; color: var(--white); letter-spacing: -0.5px; }
  .header h1 span { color: var(--gold); }
  .header p { color: var(--text-dim); font-size: 14px; margin-top: 6px; }

  .container { max-width: 820px; margin: 0 auto; padding: 24px 16px 80px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    background: var(--surface); border-radius: var(--radius); padding: 4px; border: 1px solid var(--border);
  }
  .tab {
    flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 600;
    color: var(--text-dim); background: none; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s;
  }
  .tab:hover { color: var(--text); background: var(--surface-2); }
  .tab.active { background: var(--gold); color: var(--navy); }

  .panel { display: none; }
  .panel.active { display: block; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 13px; font-weight: 600; color: var(--text-dim);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  input[type="text"], input[type="number"], textarea, select {
    width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-family: inherit; font-size: 14px; transition: border-color 0.2s;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--gold); }
  textarea { resize: vertical; min-height: 80px; }

  .col-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .col-row {
    display: grid; grid-template-columns: 1fr 130px auto auto; gap: 8px; align-items: start;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px;
  }
  .col-row.has-opts { grid-template-columns: 1fr 130px auto auto; grid-template-rows: auto auto; }
  .col-row input, .col-row select { width: 100%; padding: 8px 10px; font-size: 13px; }
  .opts-row { grid-column: 1 / -1; margin-top: 4px; }
  .opts-row input { width: 100%; font-size: 12px; padding: 7px 10px; background: var(--surface-2); }

  .btn-icon {
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text-dim);
    cursor: pointer; font-size: 18px; transition: all 0.2s;
  }
  .btn-icon:hover { border-color: var(--text-dim); color: var(--text); }
  .btn-icon.remove:hover { border-color: var(--red); color: var(--red); }

  .btn-add {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
    background: var(--surface-2); border: 1px dashed var(--border); border-radius: var(--radius);
    color: var(--text-dim); font-size: 13px; cursor: pointer; transition: all 0.2s;
  }
  .btn-add:hover { border-color: var(--gold); color: var(--gold); }

  .sample-hint { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  .btn-generate {
    display: block; width: 100%; padding: 14px; background: var(--gold); color: var(--navy);
    font-family: inherit; font-size: 15px; font-weight: 700; border: none; border-radius: var(--radius);
    cursor: pointer; margin-top: 24px; transition: background 0.2s;
  }
  .btn-generate:hover { background: var(--gold-dim); }
  .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

  .status {
    text-align: center; padding: 12px; margin-top: 12px; border-radius: var(--radius); font-size: 13px; display: none;
  }
  .status.success { display: block; background: rgba(76,175,80,0.15); border: 1px solid rgba(76,175,80,0.3); color: var(--green); }
  .status.error { display: block; background: rgba(231,76,76,0.15); border: 1px solid rgba(231,76,76,0.3); color: var(--red); }
  .status.loading { display: block; background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.2); color: var(--gold); }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 140px; gap: 12px; }

  .info-box {
    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--gold);
    border-radius: 0 var(--radius) var(--radius) 0; padding: 12px 14px; font-size: 13px;
    color: var(--text-dim); margin-bottom: 20px; line-height: 1.6;
  }
  .info-box code { background: var(--surface-2); padding: 1px 5px; border-radius: 3px; font-size: 12px; color: var(--gold); }

  .footer {
    text-align: center; padding: 20px; font-size: 12px; color: var(--text-dim);
    border-top: 1px solid var(--border); margin-top: 40px;
  }
  .footer a { color: var(--gold); text-decoration: none; }

  .preview-wrap {
    overflow-x: auto; margin-top: 16px; border-radius: var(--radius); border: 1px solid var(--border); display: none;
  }
  .preview-wrap.show { display: block; }
  .preview-wrap table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .preview-wrap th {
    background: var(--navy); color: var(--white); padding: 8px 10px; text-align: center;
    font-weight: 600; border-bottom: 2px solid var(--gold); white-space: nowrap;
  }
  .preview-wrap td { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text-dim); text-align: center; }
  .preview-wrap tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  .preview-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-top: 20px; margin-bottom: 4px; }

  /* Progress bar for multi-sheet */
  .progress-wrap { margin-top: 12px; display: none; }
  .progress-wrap.show { display: block; }
  .progress-bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 3px; transition: width 0.3s; width: 0%; }
  .progress-text { font-size: 12px; color: var(--text-dim); margin-top: 6px; text-align: center; }

  /* Feature toggles */
  .features-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px;
  }
  .feat-toggle {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; user-select: none; transition: border-color 0.2s;
  }
  .feat-toggle:hover { border-color: var(--gold); }
  .feat-toggle input[type="checkbox"] { display: none; }
  .feat-check {
    width: 20px; height: 20px; border-radius: 4px; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all 0.15s; font-size: 13px; color: transparent; background: var(--surface-2);
  }
  .feat-toggle input:checked ~ .feat-check {
    background: var(--gold); border-color: var(--gold); color: var(--navy);
  }
  .feat-label { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .feat-desc { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

  @media (max-width: 600px) {
    .col-row { grid-template-columns: 1fr 110px auto auto; }
    .row-2, .row-3 { grid-template-columns: 1fr; }
    .header h1 { font-size: 22px; }
    .features-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📊 Excel <span>Builder</span></h1>
  <p>Build formatted spreadsheets instantly — free, no login, no install</p>
</div>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="switchTab('manual')">🛠️ Manual Builder</button>
    <button class="tab" onclick="switchTab('ai')">🤖 AI Builder</button>
  </div>

  <!-- ═══ MANUAL PANEL ═══ -->
  <div id="panel-manual" class="panel active">
    <div class="row-3">
      <div class="field">
        <label>Spreadsheet Title</label>
        <input type="text" id="m-title" placeholder="e.g. Gate & Barrier Outage Tracker" value="">
      </div>
      <div class="field">
        <label>File Name</label>
        <input type="text" id="m-filename" placeholder="e.g. Outage_Tracker" value="">
      </div>
      <div class="field">
        <label>Blank Rows</label>
        <input type="number" id="m-rows" value="200" min="10" max="2000">
      </div>
    </div>

    <div class="field">
      <label>Columns</label>
      <div id="col-list" class="col-list"></div>
      <button class="btn-add" onclick="addColumn()">+ Add Column</button>
    </div>

    <div class="field">
      <label>Sample Data <span style="font-weight:400;text-transform:none;">(optional)</span></label>
      <textarea id="m-sample" placeholder="One row per line, values separated by |&#10;e.g. Main Gate | 08:30 AM | John Smith | Fixed"></textarea>
      <div class="sample-hint">Each line = one row. Separate values with <code>|</code> in the same order as your columns.</div>
    </div>

    <div class="field">
      <label>Features</label>
      <div class="features-grid">
        <label class="feat-toggle">
          <input type="checkbox" id="feat-formulas" checked>
          <span class="feat-check">✓</span>
          <div><div class="feat-label">Auto Formulas</div><div class="feat-desc">SUM, profit, margins, GPA, BMI &amp; 40+ patterns</div></div>
        </label>
        <label class="feat-toggle">
          <input type="checkbox" id="feat-cf" checked>
          <span class="feat-check">✓</span>
          <div><div class="feat-label">Conditional Formatting</div><div class="feat-desc">Data bars, color scales, red/green highlights</div></div>
        </label>
        <label class="feat-toggle">
          <input type="checkbox" id="feat-freeze" checked>
          <span class="feat-check">✓</span>
          <div><div class="feat-label">Frozen Headers</div><div class="feat-desc">Header row stays visible when scrolling</div></div>
        </label>
        <label class="feat-toggle">
          <input type="checkbox" id="feat-filter" checked>
          <span class="feat-check">✓</span>
          <div><div class="feat-label">Auto Filters</div><div class="feat-desc">Dropdown filters on every column</div></div>
        </label>
        <label class="feat-toggle">
          <input type="checkbox" id="feat-stripe" checked>
          <span class="feat-check">✓</span>
          <div><div class="feat-label">Alternating Rows</div><div class="feat-desc">Striped row shading for readability</div></div>
        </label>
        <label class="feat-toggle">
          <input type="checkbox" id="feat-header" checked>
          <span class="feat-check">✓</span>
          <div><div class="feat-label">Styled Header</div><div class="feat-desc">Gold bar, title row &amp; navy headers</div></div>
        </label>
      </div>
    </div>

    <p class="preview-label">Preview</p>
    <div id="preview" class="preview-wrap"></div>

    <button class="btn-generate" onclick="generateManual()">⬇ Generate & Download Excel</button>
    <div id="status-manual" class="status"></div>
  </div>

  <!-- ═══ AI PANEL ═══ -->
  <div id="panel-ai" class="panel">
    <div class="field">
      <label>Describe your spreadsheet</label>
      <textarea id="ai-desc" rows="6" placeholder="e.g. Complete project management workbook with a task tracker sheet, team members sheet, budget sheet with formulas, and a dashboard summary. Include dropdowns for status and priority, conditional formatting, and sample data."></textarea>
    </div>

    <div class="row-2">
      <div class="field">
        <label>File Name</label>
        <input type="text" id="ai-filename" placeholder="e.g. Project_Manager">
      </div>
      <div class="field">
        <label>Rows per sheet</label>
        <input type="number" id="ai-rows" value="200" min="10" max="2000">
      </div>
    </div>

    <button class="btn-generate" id="btn-ai-gen" onclick="generateAI()">🤖 Generate with AI</button>
    <div id="status-ai" class="status"></div>
    <div id="progress-ai" class="progress-wrap">
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="progress-text" class="progress-text"></div>
    </div>
  </div>

  <div class="footer">
    Built by <a href="https://github.com/shinrising3-debug" target="_blank">shinrising3-debug</a> · <a href="https://github.com/shinrising3-debug/excel-builder" target="_blank">GitHub Repo</a> · MIT License
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  PALETTE
// ═══════════════════════════════════════════════════════════════════
const P = {
  DARK_BG:   '1B2A4A',
  GOLD:      'D4AF37',
  WHITE:     'FFFFFF',
  OFF_WHITE: 'F8F9FA',
  MID_GRAY:  'CED4DA',
  TXT:       '212529',
  MUTED:     '6C757D',
  HDR_LINE:  '0F1B33',
  LIGHT_BLUE:'DCE6F1',
  LIGHT_GREEN:'D1E7DD',
  LIGHT_RED: 'F8D7DA',
  LIGHT_YELLOW:'FFF3CD',
  BLUE_ACC:  '4472C4',
  GREEN_ACC: '548235',
  RED_ACC:   'C00000',
};

const CF_COLORS = [
  'FFD1E7DD', 'FFFFF3CD', 'FFF8D7DA', 'FFCFE2FF',
  'FFE2D9F3', 'FFFDE8CD', 'FFD4EDDA', 'FFFFF0F0',
];

// Dashboard palette
const DASH_COLORS = [
  '4472C4', '548235', 'ED7D31', 'C00000', '7030A0',
  'FFC000', '00B0F0', 'BF8F00', '44546A', '70AD47',
];

const WIDTH_MAP = { text: 22, number: 14, currency: 16, date: 16, dropdown: 20, long: 42, percentage: 14, email: 28, phone: 18, time: 14, formula: 18 };
const CENTER_TYPES = new Set(['number', 'currency', 'date', 'dropdown', 'percentage', 'time']);

// ═══════════════════════════════════════════════════════════════════
//  TAB SWITCH
// ═══════════════════════════════════════════════════════════════════
function switchTab(which) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (which === 'manual' ? i === 0 : i === 1));
  });
  document.getElementById('panel-manual').classList.toggle('active', which === 'manual');
  document.getElementById('panel-ai').classList.toggle('active', which === 'ai');
}

// ═══════════════════════════════════════════════════════════════════
//  COLUMN BUILDER (Manual)
// ═══════════════════════════════════════════════════════════════════
let columns = [];
let colId = 0;

function addColumn(name = '', type = 'text', opts = '') {
  const id = colId++;
  columns.push({ id, name, type, opts });
  renderColumns();
}

function removeColumn(id) { columns = columns.filter(c => c.id !== id); renderColumns(); updatePreview(); }
function moveColumn(id, dir) {
  const idx = columns.findIndex(c => c.id === id);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= columns.length) return;
  [columns[idx], columns[newIdx]] = [columns[newIdx], columns[idx]];
  renderColumns(); updatePreview();
}

function updateCol(id, field, val) {
  const col = columns.find(c => c.id === id);
  if (col) { col[field] = val; if (field === 'type') renderColumns(); updatePreview(); }
}

function renderColumns() {
  const list = document.getElementById('col-list');
  list.innerHTML = columns.map((c, i) => {
    const showOpts = c.type === 'dropdown';
    return `
      <div class="col-row ${showOpts ? 'has-opts' : ''}">
        <input type="text" value="${esc(c.name)}" placeholder="Column name"
               oninput="updateCol(${c.id},'name',this.value)">
        <select onchange="updateCol(${c.id},'type',this.value)">
          <option value="text" ${c.type==='text'?'selected':''}>Text</option>
          <option value="date" ${c.type==='date'?'selected':''}>Date</option>
          <option value="number" ${c.type==='number'?'selected':''}>Number</option>
          <option value="currency" ${c.type==='currency'?'selected':''}>Currency</option>
          <option value="percentage" ${c.type==='percentage'?'selected':''}>Percentage</option>
          <option value="long" ${c.type==='long'?'selected':''}>Long Text</option>
          <option value="dropdown" ${c.type==='dropdown'?'selected':''}>Dropdown</option>
          <option value="email" ${c.type==='email'?'selected':''}>Email</option>
          <option value="phone" ${c.type==='phone'?'selected':''}>Phone</option>
          <option value="time" ${c.type==='time'?'selected':''}>Time</option>
        </select>
        <button class="btn-icon" onclick="moveColumn(${c.id},${i===0?1:-1})" title="Move">↕</button>
        <button class="btn-icon remove" onclick="removeColumn(${c.id})" title="Remove">✕</button>
        ${showOpts ? `<div class="opts-row">
          <input type="text" value="${esc(c.opts)}" placeholder="Options separated by | e.g. Pending | Fixed | Escalated"
                 oninput="updateCol(${c.id},'opts',this.value)">
        </div>` : ''}
      </div>`;
  }).join('');
}

function esc(s) { return s.replace(/"/g, '&quot;'); }

function updatePreview() {
  const wrap = document.getElementById('preview');
  const valid = columns.filter(c => c.name.trim());
  if (!valid.length) { wrap.classList.remove('show'); return; }
  wrap.classList.add('show');
  const ths = '<th>#</th>' + valid.map(c => `<th>${c.name}</th>`).join('');
  const sample = document.getElementById('m-sample').value.trim();
  let rows = '';
  if (sample) {
    sample.split('\n').slice(0, 3).forEach((line, i) => {
      const vals = line.split('|').map(v => v.trim());
      rows += `<tr><td>${i+1}</td>` + valid.map((_, j) => `<td>${vals[j]||''}</td>`).join('') + '</tr>';
    });
  } else {
    rows = `<tr><td>1</td>` + valid.map(() => '<td style="color:#555">—</td>').join('') + '</tr>';
  }
  wrap.innerHTML = `<table><tr>${ths}</tr>${rows}</table>`;
}

addColumn('', 'text');
addColumn('', 'text');
addColumn('', 'text');
document.getElementById('m-sample').addEventListener('input', updatePreview);

// ═══════════════════════════════════════════════════════════════════
//  EXCEL GENERATION ENGINE — Multi-sheet, formulas, filters, dashboard
// ═══════════════════════════════════════════════════════════════════
function argb(hex) { return 'FF' + hex; }
function thinBorder(color) { return { style: 'thin', color: { argb: argb(color || P.MID_GRAY) } }; }
function border(color) { const s = thinBorder(color); return { top: s, bottom: s, left: s, right: s }; }

function getColLetter(n) {
  let s = '';
  while (n > 0) { n--; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); }
  return s;
}

// Parse a cell value — try number, date, or keep string
function parseValue(val, type) {
  if (!val || val === 'N/A' || val === '-' || val === '—') return val;
  if (type === 'currency') {
    const n = parseFloat(val.replace(/[^0-9.\-]/g, ''));
    return isNaN(n) ? val : n;
  }
  if (type === 'number') {
    const n = parseFloat(val);
    return isNaN(n) ? val : n;
  }
  if (type === 'percentage') {
    const n = parseFloat(val.replace('%', ''));
    return isNaN(n) ? val : n / 100;
  }
  return val;
}

// Build a single worksheet with full formatting
function buildSheet(wb, sheetSpec, numRows, feat) {
  // Default all features ON if not specified (AI mode)
  if (!feat) feat = { formulas: true, cf: true, freeze: true, filter: true, stripe: true, header: true };

  const sheetName = (sheetSpec.title || 'Sheet').substring(0, 31);
  const ws = wb.addWorksheet(sheetName);
  ws.views = [{ showGridLines: false }];

  const cols = sheetSpec.parsedCols;
  const allCols = [{ name: '#', type: 'number', width: 5, options: null, formula: null }, ...cols];
  const totalCols = allCols.length;

  // Column widths
  allCols.forEach((c, i) => { ws.getColumn(i + 1).width = c.width; });

  let hdrRow;

  if (feat.header) {
    // Row 1: Gold bar
    const r1 = ws.getRow(1);
    r1.height = 4;
    for (let i = 1; i <= totalCols; i++) {
      ws.getCell(1, i).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(P.GOLD) } };
    }

    // Row 2: Title
    ws.mergeCells(2, 1, 2, totalCols);
    const titleCell = ws.getCell(2, 1);
    titleCell.value = (sheetSpec.title || 'Sheet').toUpperCase();
    titleCell.font = { name: 'Aptos', bold: true, size: 16, color: { argb: argb(P.DARK_BG) } };
    titleCell.alignment = { horizontal: 'left', vertical: 'middle', indent: 1 };
    ws.getRow(2).height = 38;

    // Row 3: Subtitle
    ws.mergeCells(3, 1, 3, totalCols);
    const now = new Date();
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dateStr = `${months[now.getMonth()]} ${String(now.getDate()).padStart(2,'0')}, ${now.getFullYear()}`;
    const subCell = ws.getCell(3, 1);
    subCell.value = `Generated ${dateStr}  ·  ${numRows} rows pre-formatted`;
    subCell.font = { name: 'Aptos', size: 10, color: { argb: argb(P.MUTED) } };
    subCell.alignment = { horizontal: 'left', vertical: 'middle', indent: 1 };
    ws.getRow(3).height = 22;

    // Row 4: spacer
    ws.getRow(4).height = 6;

    hdrRow = 5;
  } else {
    // No styled header — headers go on row 1
    hdrRow = 1;
  }

  // Header row
  ws.getRow(hdrRow).height = 30;
  for (let i = 0; i < allCols.length; i++) {
    const cell = ws.getCell(hdrRow, i + 1);
    cell.value = allCols[i].name;
    if (feat.header) {
      cell.font = { name: 'Aptos', bold: true, size: 10, color: { argb: argb(P.WHITE) } };
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(P.DARK_BG) } };
      cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      cell.border = {
        left: thinBorder(P.HDR_LINE), right: thinBorder(P.HDR_LINE),
        top: thinBorder(P.HDR_LINE),
        bottom: { style: 'medium', color: { argb: argb(P.GOLD) } },
      };
    } else {
      cell.font = { name: 'Aptos', bold: true, size: 10, color: { argb: argb(P.TXT) } };
      cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      cell.border = { bottom: { style: 'thin', color: { argb: argb(P.MID_GRAY) } } };
    }
  }

  // Auto-filter on header row
  if (feat.filter) {
    ws.autoFilter = {
      from: { row: hdrRow, column: 1 },
      to: { row: hdrRow, column: totalCols }
    };
  }

  // Data rows
  const dataStart = hdrRow + 1;
  const endRow = dataStart + numRows - 1;

  for (let row = dataStart; row <= endRow; row++) {
    const isAlt = (row - dataStart) % 2 === 1;
    const fill = feat.stripe
      ? { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(isAlt ? P.OFF_WHITE : P.WHITE) } }
      : { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(P.WHITE) } };
    ws.getRow(row).height = 28;

    // # column
    ws.getCell(row, 1).value = row - dataStart + 1;

    for (let i = 0; i < allCols.length; i++) {
      const col = allCols[i];
      const cell = ws.getCell(row, i + 1);
      cell.font = { name: 'Aptos', size: 10, color: { argb: argb(P.TXT) } };
      cell.border = border();
      cell.fill = fill;
      const h = CENTER_TYPES.has(col.type) || col.name === '#' ? 'center' : 'left';
      cell.alignment = { horizontal: h, vertical: 'middle', wrapText: true };
      if (col.type === 'date') cell.numFmt = 'mm/dd/yyyy';
      if (col.type === 'currency') cell.numFmt = '$#,##0.00';
      if (col.type === 'percentage') cell.numFmt = '0.0%';
      if (col.type === 'time') cell.numFmt = 'h:mm AM/PM';
      if (col.type === 'number') cell.numFmt = '#,##0';

      // Formula columns
      if (col.formula && i > 0) {
        try {
          // Replace column references like {ColName} with cell refs
          let f = col.formula;
          cols.forEach((c, ci) => {
            const letter = getColLetter(ci + 2); // +2 because # col is 1
            const regex = new RegExp('\\{' + c.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\}', 'gi');
            f = f.replace(regex, letter + row);
          });
          cell.value = { formula: f };
        } catch (e) {
          // If formula fails, leave cell empty
        }
      }
    }
  }

  // Sample data
  if (sheetSpec.sample_data) {
    const lines = sheetSpec.sample_data.trim().split('\n').filter(l => l.trim());
    lines.forEach((line, ri) => {
      const row = dataStart + ri;
      if (row > endRow) return;
      const vals = line.split('|').map(v => v.trim());
      vals.forEach((val, ci) => {
        if (ci + 2 > totalCols) return;
        const col = allCols[ci + 1];
        const parsed = parseValue(val, col.type);
        const cell = ws.getCell(row, ci + 2);
        // Don't overwrite formula cells with sample data values
        if (col.formula) return;
        cell.value = parsed;
      });
      ws.getRow(row).height = 34;
    });
  }

  // Dropdowns via data validation
  allCols.forEach((col, i) => {
    if (col.type === 'dropdown' && col.options && col.options.length) {
      for (let row = dataStart; row <= endRow; row++) {
        ws.getCell(row, i + 1).dataValidation = {
          type: 'list', allowBlank: true,
          formulae: ['"' + col.options.join(',') + '"'],
          showDropDown: true,
          promptTitle: `Select ${col.name}`,
        };
      }
    }
  });

  // Conditional formatting on dropdown columns
  const ddCols = feat.cf ? allCols.map((c, i) => ({ col: c, idx: i })).filter(x => x.col.type === 'dropdown' && x.col.options) : [];
  if (ddCols.length) {
    const last = ddCols[ddCols.length - 1];
    const cfLetter = getColLetter(last.idx + 1);
    const rangeStr = `A${dataStart}:${getColLetter(totalCols)}${endRow}`;
    last.col.options.forEach((opt, oi) => {
      const cfColor = CF_COLORS[oi % CF_COLORS.length];
      ws.addConditionalFormatting({
        ref: rangeStr,
        rules: [{
          type: 'expression',
          formulae: [`$${cfLetter}${dataStart}="${opt}"`],
          style: { fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: cfColor } } },
          priority: oi + 1,
        }],
      });
    });
  }

  // Conditional formatting rules from AI spec
  if (feat.cf && sheetSpec.conditional_formatting) {
    sheetSpec.conditional_formatting.forEach((rule, ri) => {
      try {
        // Find column index
        const colIdx = allCols.findIndex(c => c.name.toLowerCase() === rule.column.toLowerCase());
        if (colIdx < 0) return;
        const letter = getColLetter(colIdx + 1);

        if (rule.type === 'color_scale') {
          ws.addConditionalFormatting({
            ref: `${letter}${dataStart}:${letter}${endRow}`,
            rules: [{
              type: 'colorScale',
              cfvo: [{ type: 'min' }, { type: 'percentile', value: 50 }, { type: 'max' }],
              color: [{ argb: 'FFF8696B' }, { argb: 'FFFFEB84' }, { argb: 'FF63BE7B' }],
              priority: 100 + ri,
            }],
          });
        } else if (rule.type === 'data_bar') {
          ws.addConditionalFormatting({
            ref: `${letter}${dataStart}:${letter}${endRow}`,
            rules: [{
              type: 'dataBar',
              minLength: 0, maxLength: 100,
              gradient: true,
              cfvo: [{ type: 'min' }, { type: 'max' }],
              color: { argb: 'FF4472C4' },
              priority: 100 + ri,
            }],
          });
        } else if (rule.type === 'icon_set') {
          ws.addConditionalFormatting({
            ref: `${letter}${dataStart}:${letter}${endRow}`,
            rules: [{
              type: 'iconSet',
              iconSet: '3TrafficLights',
              cfvo: [{ type: 'percent', value: 0 }, { type: 'percent', value: 33 }, { type: 'percent', value: 67 }],
              priority: 100 + ri,
            }],
          });
        } else if (rule.type === 'highlight' && rule.condition && rule.color) {
          ws.addConditionalFormatting({
            ref: `${letter}${dataStart}:${letter}${endRow}`,
            rules: [{
              type: 'expression',
              formulae: [`${letter}${dataStart}${rule.condition}`],
              style: { fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: 'FF' + rule.color } } },
              priority: 100 + ri,
            }],
          });
        }
      } catch (e) { /* skip bad rule */ }
    });
  }

  // Freeze panes
  if (feat.freeze) {
    ws.views = [{ state: 'frozen', ySplit: dataStart - 1, showGridLines: false }];
  } else {
    ws.views = [{ showGridLines: false }];
  }

  // Print setup
  ws.pageSetup = { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 };

  return { ws, dataStart, endRow, allCols, totalCols };
}

// KPI card color themes (label row = dark, value row = light tint)
const KPI_THEMES = {
  blue:   { label: '1B4F72', value: 'D6EAF8', text: '1B4F72' },
  green:  { label: '1E8449', value: 'D5F5E3', text: '1E8449' },
  red:    { label: '922B21', value: 'FADBD8', text: '922B21' },
  orange: { label: 'BA4A00', value: 'FDEBD0', text: 'BA4A00' },

// Build a dashboard summary sheet
function buildDashboard(wb, dashSpec, otherSheets) {
  const ws = wb.addWorksheet((dashSpec.title || 'Dashboard').substring(0, 31));
  ws.views = [{ showGridLines: false }];

  const headerWidth = 10;
  ws.getColumn(1).width = 3;
  for (let i = 2; i <= headerWidth; i++) ws.getColumn(i).width = 16;

  // Row 1: Gold bar
  ws.getRow(1).height = 5;
  for (let i = 1; i <= headerWidth; i++) {
    ws.getCell(1, i).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(P.GOLD) } };
  }

  // Row 2: Title
  ws.mergeCells(2, 1, 2, headerWidth);
  const titleCell = ws.getCell(2, 1);
  titleCell.value = (dashSpec.title || 'DASHBOARD').toUpperCase();
  titleCell.font = { name: 'Aptos', bold: true, size: 22, color: { argb: argb(P.DARK_BG) } };
  titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
  ws.getRow(2).height = 50;

  // Row 3: Date
  ws.mergeCells(3, 1, 3, headerWidth);
  const now = new Date();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dateStr = `${months[now.getMonth()]} ${String(now.getDate()).padStart(2,'0')}, ${now.getFullYear()}`;
  const subCell = ws.getCell(3, 1);
  subCell.value = `Last Updated: ${dateStr}`;
  subCell.font = { name: 'Aptos', size: 10, color: { argb: argb(P.MUTED) } };
  subCell.alignment = { horizontal: 'center', vertical: 'middle' };
  ws.getRow(3).height = 22;

  ws.getRow(4).height = 12;

  // KPI section header
  let currentRow = 5;
  ws.mergeCells(currentRow, 2, currentRow, headerWidth);
  const kpiHdr = ws.getCell(currentRow, 2);
  kpiHdr.value = 'KEY PERFORMANCE INDICATORS';
  kpiHdr.font = { name: 'Aptos', size: 11, bold: true, color: { argb: argb(P.DARK_BG) } };
  kpiHdr.alignment = { horizontal: 'left', vertical: 'middle' };
  kpiHdr.border = { bottom: { style: 'medium', color: { argb: argb(P.GOLD) } } };
  ws.getRow(currentRow).height = 28;
  currentRow += 2;

  // KPI cards — colored label row + tinted value row (Training Tracker style)
  if (dashSpec.kpis && dashSpec.kpis.length) {
    const kpisPerRow = Math.min(dashSpec.kpis.length, 4);
    const colsPerKpi = Math.floor((headerWidth - 1) / kpisPerRow);
    const defaultKpiColors = ['blue', 'green', 'orange', 'purple', 'red', 'navy', 'gold', 'blue'];

    dashSpec.kpis.forEach((kpi, ki) => {
      const startCol = 2 + (ki % kpisPerRow) * colsPerKpi;
      const endCol = startCol + colsPerKpi - 1;

      if (ki > 0 && ki % kpisPerRow === 0) currentRow += 4;

      const colorKey = kpi.color || defaultKpiColors[ki % defaultKpiColors.length];
      const theme = KPI_THEMES[colorKey] || KPI_THEMES.blue;

      // Label row — dark background, white text
      ws.mergeCells(currentRow, startCol, currentRow, endCol);
      const labelCell = ws.getCell(currentRow, startCol);
      labelCell.value = (kpi.label || 'Metric').toUpperCase();
      labelCell.font = { name: 'Aptos', size: 9, bold: true, color: { argb: argb(P.WHITE) } };
      labelCell.alignment = { horizontal: 'center', vertical: 'middle' };
      labelCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(theme.label) } };
      labelCell.border = border(theme.label);
      ws.getRow(currentRow).height = 26;

      // Value row — tinted background, large colored number
      ws.mergeCells(currentRow + 1, startCol, currentRow + 2, endCol);
      const valCell = ws.getCell(currentRow + 1, startCol);

      if (kpi.formula) {
        try { valCell.value = { formula: kpi.formula }; } catch { valCell.value = kpi.value || '—'; }
      } else {
        valCell.value = kpi.value || '—';
      }
      valCell.font = { name: 'Aptos', size: 24, bold: true, color: { argb: argb(theme.text) } };
      valCell.alignment = { horizontal: 'center', vertical: 'middle' };
      valCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(theme.value) } };
      valCell.border = border(theme.label);
      if (kpi.format === 'currency') valCell.numFmt = '$#,##0.00';
      if (kpi.format === 'percentage') valCell.numFmt = '0.0%';
      if (kpi.format === 'number') valCell.numFmt = '#,##0';

      ws.getRow(currentRow + 1).height = 22;
      ws.getRow(currentRow + 2).height = 22;
    });

    currentRow += 4;
  }

  // Summary tables from AI
  if (dashSpec.summary_tables) {
    dashSpec.summary_tables.forEach((table) => {
      currentRow += 2;
      // Section title with gold underline
      ws.mergeCells(currentRow, 2, currentRow, headerWidth);
      const secCell = ws.getCell(currentRow, 2);
      secCell.value = (table.title || 'Summary').toUpperCase();
      secCell.font = { name: 'Aptos', size: 11, bold: true, color: { argb: argb(P.DARK_BG) } };
      secCell.alignment = { horizontal: 'left', vertical: 'middle' };
      secCell.border = { bottom: { style: 'medium', color: { argb: argb(P.GOLD) } } };
      ws.getRow(currentRow).height = 30;
      currentRow++;

      // Table headers
      if (table.headers && table.headers.length) {
        const colSpan = Math.max(2, Math.floor((headerWidth - 1) / table.headers.length));
        table.headers.forEach((h, hi) => {
          const col = 2 + hi * colSpan;
          ws.mergeCells(currentRow, col, currentRow, Math.min(col + colSpan - 1, headerWidth));
          const hCell = ws.getCell(currentRow, col);
          hCell.value = h;
          hCell.font = { name: 'Aptos', size: 10, bold: true, color: { argb: argb(P.WHITE) } };
          hCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(P.DARK_BG) } };
          hCell.alignment = { horizontal: 'center', vertical: 'middle' };
          hCell.border = border(P.HDR_LINE);
        });
        ws.getRow(currentRow).height = 28;
        currentRow++;
      }

      // Table data rows
      if (table.rows) {
        table.rows.forEach((rowData, ri) => {
          const vals = Array.isArray(rowData) ? rowData : rowData.split('|').map(v => v.trim());
          const colSpan = Math.max(2, Math.floor((headerWidth - 1) / vals.length));
          const isAlt = ri % 2 === 1;
          vals.forEach((v, vi) => {
            const col = 2 + vi * colSpan;
            ws.mergeCells(currentRow, col, currentRow, Math.min(col + colSpan - 1, headerWidth));
            const cell = ws.getCell(currentRow, col);
            const num = parseFloat(v.replace?.(/[^0-9.\-]/g, ''));
            cell.value = !isNaN(num) && v.includes('$') ? num : v;
            cell.font = { name: 'Aptos', size: 10, color: { argb: argb(P.TXT) } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(isAlt ? P.OFF_WHITE : P.WHITE) } };
            cell.alignment = { horizontal: 'center', vertical: 'middle' };
            cell.border = border();
            if (v.includes('$')) cell.numFmt = '$#,##0.00';
            if (v.includes('%')) cell.numFmt = '0.0%';
          });
          ws.getRow(currentRow).height = 26;
          currentRow++;
        });
      }
    });
  }

  // Print
  ws.pageSetup = { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 };
  return ws;
}

// Build a reference/info sheet (section-based layout like SOPs, contacts, guides)
function buildReference(wb, sheetSpec) {
  const sheetName = (sheetSpec.title || 'Reference').substring(0, 31);
  const ws = wb.addWorksheet(sheetName);
  ws.views = [{ showGridLines: false }];

  const totalWidth = 8;
  ws.getColumn(1).width = 3;
  ws.getColumn(2).width = 28;
  ws.getColumn(3).width = 50;
  for (let i = 4; i <= totalWidth; i++) ws.getColumn(i).width = 16;

  // Row 1: Gold accent bar
  ws.getRow(1).height = 5;
  for (let i = 1; i <= totalWidth; i++) {
    ws.getCell(1, i).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(P.GOLD) } };
  }

  // Row 2: Sheet title
  ws.mergeCells(2, 1, 2, totalWidth);
  const titleCell = ws.getCell(2, 1);
  titleCell.value = (sheetSpec.title || 'Reference').toUpperCase();
  titleCell.font = { name: 'Aptos', bold: true, size: 18, color: { argb: argb(P.DARK_BG) } };
  titleCell.alignment = { horizontal: 'left', vertical: 'middle', indent: 1 };
  ws.getRow(2).height = 44;

  // Row 3: Subtitle
  ws.mergeCells(3, 1, 3, totalWidth);
  const now = new Date();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dateStr = `${months[now.getMonth()]} ${String(now.getDate()).padStart(2,'0')}, ${now.getFullYear()}`;
  const subCell = ws.getCell(3, 1);
  subCell.value = `Reference Guide  ·  Updated ${dateStr}`;
  subCell.font = { name: 'Aptos', size: 10, color: { argb: argb(P.MUTED) } };
  subCell.alignment = { horizontal: 'left', vertical: 'middle', indent: 1 };
  ws.getRow(3).height = 22;

  let currentRow = 5;
  const defaultColors = ['blue', 'green', 'yellow', 'purple', 'orange', 'red'];

  const sections = sheetSpec.sections || [];
  sections.forEach((section, si) => {
    const colorKey = section.color || defaultColors[si % defaultColors.length];
    const theme = SECTION_THEMES[colorKey] || SECTION_THEMES.blue;

    // Section header — merged across all columns
    ws.mergeCells(currentRow, 1, currentRow, totalWidth);
    const hdrCell = ws.getCell(currentRow, 1);
    hdrCell.value = '  ' + (section.title || 'Section').toUpperCase();
    hdrCell.font = { name: 'Aptos', bold: true, size: 12, color: { argb: argb(theme.headerText) } };
    hdrCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(theme.header) } };
    hdrCell.alignment = { horizontal: 'left', vertical: 'middle' };
    hdrCell.border = {
      bottom: { style: 'medium', color: { argb: argb(theme.accent) } },
    };
    ws.getRow(currentRow).height = 32;
    currentRow++;

    // Section rows — key-value pairs with tinted background
    const rows = section.rows || [];
    rows.forEach((rowData, ri) => {
      const vals = Array.isArray(rowData) ? rowData : [rowData];
      const isAlt = ri % 2 === 0;

      // Label cell (column 2)
      ws.getCell(currentRow, 1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(isAlt ? theme.bg : P.WHITE) } };
      ws.getCell(currentRow, 1).border = border();

      if (vals.length >= 2) {
        // Key-value layout
        ws.getCell(currentRow, 2).value = vals[0];
        ws.getCell(currentRow, 2).font = { name: 'Aptos', size: 10, bold: true, color: { argb: argb(theme.header) } };
        ws.getCell(currentRow, 2).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(isAlt ? theme.bg : P.WHITE) } };
        ws.getCell(currentRow, 2).alignment = { horizontal: 'left', vertical: 'middle', indent: 1 };
        ws.getCell(currentRow, 2).border = border();

        // Value — merge across remaining columns
        ws.mergeCells(currentRow, 3, currentRow, totalWidth);
        ws.getCell(currentRow, 3).value = vals[1];
        ws.getCell(currentRow, 3).font = { name: 'Aptos', size: 10, color: { argb: argb(P.TXT) } };
        ws.getCell(currentRow, 3).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(isAlt ? theme.bg : P.WHITE) } };
        ws.getCell(currentRow, 3).alignment = { horizontal: 'left', vertical: 'middle', wrapText: true, indent: 1 };
        ws.getCell(currentRow, 3).border = border();
      } else {
        // Single value spanning all
        ws.mergeCells(currentRow, 2, currentRow, totalWidth);
        ws.getCell(currentRow, 2).value = vals[0];
        ws.getCell(currentRow, 2).font = { name: 'Aptos', size: 10, color: { argb: argb(P.TXT) } };
        ws.getCell(currentRow, 2).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(isAlt ? theme.bg : P.WHITE) } };
        ws.getCell(currentRow, 2).alignment = { horizontal: 'left', vertical: 'middle', wrapText: true, indent: 1 };
        ws.getCell(currentRow, 2).border = border();
      }

      ws.getRow(currentRow).height = 28;
      currentRow++;
    });

    currentRow += 1; // Gap between sections
  });

  // Freeze top rows
  ws.views = [{ state: 'frozen', ySplit: 3, showGridLines: false }];
  ws.pageSetup = { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 };
  return ws;
}

// ═══════════════════════════════════════════════════════════════════
//  DOWNLOAD TRIGGER
// ═══════════════════════════════════════════════════════════════════
async function downloadWorkbook(wb, filename) {
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename.endsWith('.xlsx') ? filename : filename + '.xlsx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function getFeatureToggles() {
  return {
    formulas: document.getElementById('feat-formulas')?.checked ?? true,
    cf: document.getElementById('feat-cf')?.checked ?? true,
    freeze: document.getElementById('feat-freeze')?.checked ?? true,
    filter: document.getElementById('feat-filter')?.checked ?? true,
    stripe: document.getElementById('feat-stripe')?.checked ?? true,
    header: document.getElementById('feat-header')?.checked ?? true,
  };
}

async function generateManual() {
  const status = document.getElementById('status-manual');
  const title = document.getElementById('m-title').value.trim() || 'My Spreadsheet';
  const filename = document.getElementById('m-filename').value.trim() || 'Spreadsheet';
  const numRows = Math.min(2000, Math.max(10, parseInt(document.getElementById('m-rows').value) || 200));
  const sample = document.getElementById('m-sample').value.trim();
  const feat = getFeatureToggles();

  const validCols = columns.filter(c => c.name.trim());
  if (!validCols.length) { showStatus(status, 'error', 'Add at least one column with a name.'); return; }

  const cols = validCols.map(c => ({
    name: c.name.trim(), type: c.type, width: WIDTH_MAP[c.type] || 22,
    options: c.type === 'dropdown' && c.opts ? c.opts.split('|').map(o => o.trim()).filter(Boolean) : null,
    formula: null,
  }));

  // Auto-detect formulas from column names
  if (feat.formulas) autoDetectFormulas(cols);

  // Auto-detect conditional formatting
  const cfRules = feat.cf ? autoDetectCF(cols) : [];

  showStatus(status, 'loading', 'Building your spreadsheet...');
  try {
    const wb = new ExcelJS.Workbook();
    buildSheet(wb, {
      title,
      parsedCols: cols,
      sample_data: sample || null,
      conditional_formatting: cfRules.length ? cfRules : null,
    }, numRows, feat);
    await downloadWorkbook(wb, filename);
    showStatus(status, 'success', `✅ ${filename}.xlsx downloaded!`);
  } catch (err) {
    showStatus(status, 'error', 'Error: ' + err.message);
  }
}

// Robust JSON extraction — handles backticks, truncation, trailing commas
function extractJSON(raw) {
  // Strip markdown fences
  raw = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();

  // Try direct parse first
  try { return JSON.parse(raw); } catch {}

  // Find the outermost { ... } block
  const start = raw.indexOf('{');
  if (start < 0) return null;
  let substr = raw.slice(start);

  // If JSON is truncated (no closing }), try to close it
  let opens = 0, closes = 0;
  for (const ch of substr) { if (ch === '{') opens++; if (ch === '}') closes++; }
  if (opens > closes) {
    // Try to close at the last complete sheet object
    // Find last complete "}" that could end a sheet
    let lastGoodPos = -1;
    let depth = 0;
    for (let i = 0; i < substr.length; i++) {
      if (substr[i] === '{') depth++;
      if (substr[i] === '}') { depth--; if (depth === 1) lastGoodPos = i; }
    }
    if (lastGoodPos > 0) {
      substr = substr.slice(0, lastGoodPos + 1) + ']}';
    } else {
      while (opens > closes) { substr += '}'; closes++; }
      // Close any open arrays
      const openBrackets = (substr.match(/\[/g) || []).length;
      const closeBrackets = (substr.match(/\]/g) || []).length;
      for (let i = closeBrackets; i < openBrackets; i++) substr += ']';
      substr += '}';
    }
  }

  // Fix trailing commas (,] or ,})
  substr = substr.replace(/,\s*([\]}])/g, '$1');

  try { return JSON.parse(substr); } catch {}

  // Last resort: try to fix common issues
  // Remove any non-JSON text after the last }
  const lastBrace = substr.lastIndexOf('}');
  if (lastBrace > 0) substr = substr.slice(0, lastBrace + 1);
  substr = substr.replace(/,\s*([\]}])/g, '$1');
  try { return JSON.parse(substr); } catch {}

  return null;
}

  }, type: 'currency' },
  { match: /^(sale|final|net)\s*price$/i, fn: cols => {
    const price = cols.find(c => /original.*price|list.*price|mrp|price/i.test(c.name) && !/discount|sale|final|net/i.test(c.name));
    const disc = cols.find(c => /discount\s*amount|discount$/i.test(c.name) && !/rate|%/i.test(c.name));
    return price && disc ? `{${price.name}}-{${disc.name}}` : null;
  }, type: 'currency' },
  { match: /^tax\s*(amount)?$/i, fn: cols => {
    const sub = cols.find(c => /subtotal|amount|price|total/i.test(c.name) && !/tax|grand/i.test(c.name));
    const rate = cols.find(c => /tax\s*rate|tax\s*%|gst|vat/i.test(c.name));
    return sub && rate ? `{${sub.name}}*{${rate.name}}` : null;
  }, type: 'currency' },
  { match: /^conversion\s*rate$/i, fn: cols => {
    const conv = cols.find(c => /conversions?|purchases?|orders?|sign\s*ups?/i.test(c.name));
    const visits = cols.find(c => /visitors?|visits?|sessions?|traffic|clicks?/i.test(c.name));
    return conv && visits ? `{${conv.name}}/{${visits.name}}` : null;
  }, type: 'percentage' },

  // ── GENERIC RATIOS / CATCH-ALL ────────────────────────────────
  { match: /^(.+)\s*per\s*(.+)$/i, fn: (cols, name) => {
    const m = name.match(/^(.+)\s+per\s+(.+)$/i);
    if (!m) return null;
    const num = cols.find(c => new RegExp(m[1].trim(), 'i').test(c.name) && c.name !== name);
    const den = cols.find(c => new RegExp(m[2].trim(), 'i').test(c.name) && c.name !== name);
    return num && den ? `{${num.name}}/{${den.name}}` : null;
  }, type: 'number' },
];

function autoDetectFormulas(cols) {
  cols.forEach(col => {
    if (col.formula) return; // Already has one
    for (const pat of FORMULA_PATTERNS) {
      if (pat.match.test(col.name)) {
        const f = pat.fn(cols, col.name);
        if (f) {
          col.formula = f;
          if (pat.type) col.type = pat.type;
          col.width = WIDTH_MAP[col.type] || 18;
          break;
        }
      }
    }
  });
}

function autoDetectCF(cols) {
  const rules = [];
  cols.forEach(col => {
    const n = col.name;
    // Data bars on currency totals/amounts
    if (col.type === 'currency' && /revenue|sales|income|profit|total|amount|salary|pay|price|cost|budget|spend|value|rent|mortgage/i.test(n)) {
      rules.push({ column: n, type: 'data_bar' });
    }
    // Color scale on all percentage columns
    else if (col.type === 'percentage') {
      rules.push({ column: n, type: 'color_scale' });
    }
    // Color scale on scores/ratings/points/grades/GPA
    else if (col.type === 'number' && /score|rating|rank|point|grade|gpa|mark|attendance|performance|satisfaction|quality/i.test(n)) {
      rules.push({ column: n, type: 'color_scale' });
    }
    // Green/red highlights on variance/diff columns
    if (/variance|diff|surplus|deficit|shortage|overdue|remaining|balance/i.test(n) && (col.type === 'currency' || col.type === 'number')) {
      rules.push({ column: n, type: 'highlight', condition: '<0', color: 'F8D7DA' });
      rules.push({ column: n, type: 'highlight', condition: '>0', color: 'D1E7DD' });
    }
    // Data bars on numeric quantity/volume/count columns
    else if (col.type === 'number' && /qty|quantity|stock|units?|sold|volume|count|headcount|enrolled|capacity|weight|distance|duration|calories/i.test(n)) {
      rules.push({ column: n, type: 'data_bar' });
    }
  });
  return rules;
}

let _lastAICall = 0;
const AI_COOLDOWN = 50000; // 50 seconds between calls

async function generateAI() {
  const status = document.getElementById('status-ai');
  const btn = document.getElementById('btn-ai-gen');
  const desc = document.getElementById('ai-desc').value.trim();
  const filename = document.getElementById('ai-filename').value.trim() || 'AI_Workbook';
  const numRows = Math.min(2000, Math.max(10, parseInt(document.getElementById('ai-rows').value) || 200));

  if (!desc) { showStatus(status, 'error', 'Describe what spreadsheet you want.'); return; }

  // Client-side cooldown to avoid rate limits
  const elapsed = Date.now() - _lastAICall;
  if (_lastAICall && elapsed < AI_COOLDOWN) {
    const wait = Math.ceil((AI_COOLDOWN - elapsed) / 1000);
    showStatus(status, 'error', `⏳ Please wait ${wait}s before trying again.`);
    return;
  }

  btn.disabled = true;
  showStatus(status, 'loading', 'AI is designing your workbook...');
  setProgress(10, 'Sending to AI...');

  try {
    async function callAI(temp) {
      _lastAICall = Date.now();
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 60000); // 60s timeout
      let r;
      try {
        r = await fetch(AI_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({
            model: 'openai-fast',
            messages: [
              { role: 'system', content: AI_SYSTEM_PROMPT },
              { role: 'user', content: desc }
            ],
            temperature: temp,
            max_tokens: 16000
          }),
        });
      } catch (fetchErr) {
        if (fetchErr.name === 'AbortError') throw new Error('AI took too long — try a shorter description.');
        throw new Error('Network error — check your connection and try again.');
      } finally {
        clearTimeout(timeout);
      }
      if (!r.ok) {
        const errBody = await r.text().catch(() => '');
        if (r.status === 429 || r.status === 402 || r.status === 503
            || errBody.includes('FREE_LIMIT') || errBody.includes('rate')
            || errBody.includes('limit') || errBody.includes('too many'))
          throw new Error('RATE_LIMIT');
        throw new Error(`AI service error (${r.status})`);
      }
      const d = await r.json();
      const content = d?.choices?.[0]?.message?.content;
      if (!content) throw new Error('AI returned empty response');
      return extractJSON(content);
    }

    // Try once — only retry on JSON failure (not rate limit)
    let spec;
    try {
      spec = await callAI(0.4);
    } catch (e) {
      if (e.message === 'RATE_LIMIT') throw new Error('Rate limit hit — wait about 50 seconds and try again.');
      throw e;
    }
    if (!spec) {
      setProgress(30, 'Fixing AI response, retrying...');
      await new Promise(ok => setTimeout(ok, 3000));
      try {
        spec = await callAI(0.2);
      } catch (e) {
        if (e.message === 'RATE_LIMIT') throw new Error('Rate limit hit — wait about 50 seconds and try again.');
        throw e;
      }
    }
    setProgress(45, 'Parsing workbook spec...');
    if (!spec) throw new Error('AI returned invalid JSON — please try again (try a simpler description)');

    // Support both old single-sheet and new multi-sheet format
    let sheets;
    if (spec.sheets && Array.isArray(spec.sheets)) {
      sheets = spec.sheets;
    } else if (spec.title && spec.columns) {
      // Legacy single-sheet format — wrap it
      sheets = [{ title: spec.title, type: 'data', columns: spec.columns, sample_data: spec.sample_data }];
    } else {
      throw new Error('AI returned an unrecognized format — please try again');
    }

    setProgress(50, `Building ${sheets.length}-sheet workbook...`);

    const wb = new ExcelJS.Workbook();
    wb.creator = 'Excel Builder';
    wb.created = new Date();

    let sheetCount = 0;
    // Sort: data/tracker first, reference next, dashboards last
    const dataSheets = sheets.filter(s => s.type === 'data' || s.type === 'tracker' || (!s.type && s.columns));
    const refSheets = sheets.filter(s => s.type === 'reference');
    const dashSheets = sheets.filter(s => s.type === 'dashboard');
    const orderedSheets = [...dataSheets, ...refSheets, ...dashSheets];

    for (const sheet of orderedSheets) {
      sheetCount++;
      const pct = 50 + Math.round((sheetCount / orderedSheets.length) * 40);
      setProgress(pct, `Building sheet ${sheetCount}/${orderedSheets.length}: ${sheet.title}...`);

      if (sheet.type === 'dashboard') {
        buildDashboard(wb, sheet, dataSheets);
        continue;
      }

      if (sheet.type === 'reference') {
        buildReference(wb, sheet);
        continue;
      }

      // Data or tracker sheet
      sheet.parsedCols = parseColumnsFromSpec(sheet.columns || '');

      // Apply formula definitions from AI (if any)
      if (sheet.formulas && Array.isArray(sheet.formulas)) {
        sheet.formulas.forEach(f => {
          let col = sheet.parsedCols.find(c => c.name.toLowerCase() === f.column.toLowerCase());
          if (!col) {
            col = { name: f.column, type: f.type || 'number', width: WIDTH_MAP[f.type] || 18, options: null, formula: null };
            sheet.parsedCols.push(col);
          }
          col.formula = f.formula;
        });
      }

      // AUTO-DETECT formulas based on column names
      autoDetectFormulas(sheet.parsedCols);

      // AUTO-ADD conditional formatting based on column types
      if (!sheet.conditional_formatting || !sheet.conditional_formatting.length) {
        sheet.conditional_formatting = autoDetectCF(sheet.parsedCols);
      }

      if (sheet.parsedCols.length) {
        buildSheet(wb, sheet, numRows);
      }
    }

    setProgress(95, 'Generating file...');
    await downloadWorkbook(wb, filename);

    const totalSheets = wb.worksheets.length;
    setProgress(100, 'Done!');
    showStatus(status, 'success', `✅ ${filename}.xlsx downloaded! (${totalSheets} sheet${totalSheets > 1 ? 's' : ''})`);

    setTimeout(() => { document.getElementById('progress-ai').classList.remove('show'); }, 3000);
  } catch (err) {
    document.getElementById('progress-ai').classList.remove('show');
    if (err.message.includes('Rate limit') || err.message.includes('wait') || err.message.includes('Wait')) {
      showStatus(status, 'error', '⏳ ' + err.message);
      // Start a visible countdown
      let secs = 50;
      btn.disabled = true;
      const iv = setInterval(() => {
        secs--;
        if (secs <= 0) {
          clearInterval(iv);
          btn.disabled = false;
          btn.textContent = '🤖 Generate with AI';
          showStatus(status, 'success', '✅ Ready — try again now!');
        } else {
          btn.textContent = `⏳ Wait ${secs}s...`;
        }
      }, 1000);
      return; // don't re-enable btn in finally
    } else {
      showStatus(status, 'error', 'Error: ' + err.message);
    }
  } finally {
    btn.disabled = false;
    btn.textContent = '🤖 Generate with AI';
  }
}

// Parse column spec string
function parseColumnsFromSpec(raw) {
  if (!raw) return [];
  const parts = raw.split(/,\s*(?![^(]*\))/);
  return parts.map(part => {
    part = part.trim();
    if (!part) return null;
    const match = part.match(/^(.+?)\s*\(\s*(.*?)\s*\)\s*$/);
    if (match) {
      const name = match[1].trim();
      const typeStr = match[2].trim().toLowerCase();
      if (typeStr.startsWith('dropdown')) {
        const optsMatch = typeStr.match(/:\s*(.+)/);
        const options = optsMatch ? optsMatch[1].split('|').map(o => o.trim()) : ['Option 1', 'Option 2'];
        return { name, type: 'dropdown', width: WIDTH_MAP.dropdown, options, formula: null };
      }
      const type = Object.keys(WIDTH_MAP).includes(typeStr) ? typeStr : 'text';
      return { name, type, width: WIDTH_MAP[type], options: null, formula: null };
    }
    return { name: part, type: 'text', width: WIDTH_MAP.text, options: null, formula: null };
  }).filter(Boolean);
}

function showStatus(el, type, msg) { el.className = 'status ' + type; el.textContent = msg; }
</script>
